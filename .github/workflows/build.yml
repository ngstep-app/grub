name: Build GRUB

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-grub:
    runs-on: ubuntu-24.04
    container:
      image: devuan/devuan:excalibur
      options: --privileged
    name: Build GRUB
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            git build-essential autoconf automake bison flex \
            gettext python3 pkg-config libtool \
            libdevmapper-dev libfreetype-dev \
            wget curl

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate build system
        run: |
          ./autogen.sh

      - name: Build and install i386-pc target
        run: |
          PKG_DIR="$(pwd)/grub-gershwin"
          ./configure \
            --prefix=/usr \
            --sysconfdir=/etc \
            --with-platform=pc \
            --target=i386 \
            --disable-werror
          make -j$(nproc)
          make DESTDIR="${PKG_DIR}" install

      - name: Build and install x86_64-efi target
        run: |
          PKG_DIR="$(pwd)/grub-gershwin"
          make clean
          ./configure \
            --prefix=/usr \
            --sysconfdir=/etc \
            --with-platform=efi \
            --target=x86_64 \
            --disable-werror
          make -j$(nproc)
          make DESTDIR="${PKG_DIR}" install

      - name: Create .deb package
        run: |
          set -e
          PKG_DIR="$(pwd)/grub-gershwin"
          mkdir -p "${PKG_DIR}/DEBIAN"
          cat > "${PKG_DIR}/DEBIAN/control" << 'EOF'
          Package: grub-gershwin
          Version: 2.04-gershwin1
          Architecture: amd64
          Maintainer: ngstep-app
          Description: GRUB bootloader (Gershwin fork - silent boot)
           Custom GRUB build with Welcome banner removed for silent boot.
          Provides: grub-pc-bin, grub-efi-amd64-bin, grub-common
          Conflicts: grub-pc-bin, grub-efi-amd64-bin
          EOF
          sed -i 's/^          //' "${PKG_DIR}/DEBIAN/control"
          dpkg-deb --build "${PKG_DIR}" grub-gershwin_2.04-gershwin1_amd64.deb

      - name: Upload package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -lh *.deb
          wget -c https://github.com/probonopd/uploadtool/raw/master/upload.sh
          bash upload.sh *.deb
